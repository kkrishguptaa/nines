[project]
name = "nines"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["anthropic", "hypothesis", "httpx", "rich"]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nines"]
